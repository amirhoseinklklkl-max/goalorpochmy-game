name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install -g cordova
      - run: cordova create app com.mygame.app MyGame
      - run: rm -rf app/www/*
      - run: find . -maxdepth 1 -mindepth 1 ! -name 'app' ! -name '.github' ! -name 'config.xml' ! -name '.git' -exec cp -r {} app/www/ \;
      - run: cd app && cordova plugin add cordova-plugin-whitelist
      - run: cd app && cordova platform add android
      - run: cd app && cordova build android
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
